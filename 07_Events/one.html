    // But the problem is if we click on any "li" element then it's parent will be "ul" and we have given to remove the parent, so it will result in removing all the content. So we can write like-

    document.querySelector('#images').addEventListener('click' , function(event){
        console.log(event.target.tagName) // This will the tag name as IMG , UL ,etc.
        if(event.target.tagName === "IMG"){
            console.log(event.target.id) // This will give the id of the selected element.
            let removeIt = event.target.parentNode
            removeIt.remove()
        }
    })

    // So this will not remove all the content when we click on "ul" elements, only deletes images(li elements).
