    // Task : When we click start button then printing should start and when we press the stop button then printing should stop.

    // The above code is not correct because we have declared the "start" inside the callback function of the eventListener.
    // So for clearTimeout the variable "start" is undefined so after clicking the stop it will not stop.
    // Because the scope of the "start" is Block Scope and it is not in Global Scope.
    

    let start = null;

    document.querySelector('#start').addEventListener('click', function () {
        if (start === null) {
            start = setInterval(function(){
                console.log("Hello Everyone!!");
            }, 1000);
        }
    });

    document.querySelector('#stop').addEventListener('click', function () {
        clearInterval(start);
        start = null;
    });

    // Also when we click multiple time on start then multiple setInterval will activate so to avoid this we can write code like given above.

</script>
