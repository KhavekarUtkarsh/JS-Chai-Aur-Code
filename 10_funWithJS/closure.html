    <script>

        // document.getElementById("orange").onclick = function(){
        //     document.body.style.backgroundColor = "Orange"
        // }

        // document.getElementById("green").onclick = function(){
        //     document.body.style.backgroundColor = "Green"
        // }

        // BUt when we have to do the same for suppose 500 buttons then we are not going to write it like this way.

        function clickHandler(color) {
            // document.body.style.backgroundColor = `${color}`

            return function() {
                document.body.style.backgroundColor = `${color}`
            }
        }

        document.getElementById("orange").onclick = clickHandler("orange")
        document.getElementById("green").onclick = clickHandler("green")

        // The "onclick" need a function but here we are telling that to execute the function. So here the problem arises because we are not pressing the buttons but still background color is changed.

        // So here we have to change the definition of the function.

        // So here we are now returnong the whole function to "onclick", but as we know the concept of "Lexical Scoping" and "Closure" we know that when we are returning the function then onlt the function is not returning, the whole function clickHandler"s scope is returning.
        
        // And that's why the inner function can access the value of the "color".
    </script>
